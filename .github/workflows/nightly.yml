# Nightly (docs/gelistirme/is-akisi.md §4): MySQL 8 service, slow/perf tests, hypothesis 1000
# examples, pip-audit. Playwright three-browser run and the KaTeX render check join when web/
# lands. Still no dataset/weight downloads and no AICLS_GATE_* here.
name: nightly

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC
  workflow_dispatch:

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  AICLS_ENV: test
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"

jobs:
  slow-and-mysql:
    name: slow / perf / mysql (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: aicls_test
          MYSQL_USER: aicls_test
          MYSQL_PASSWORD: aicls_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[dev]"

      - name: MySQL-marked tests (migrations head→base→head, integration)
        env:
          AICLS_TEST_MYSQL_URL: mysql+pymysql://aicls_test:aicls_test@127.0.0.1:3306/aicls_test?charset=utf8mb4
          AICLS_DATA_ROOT: ${{ runner.temp }}/aicls-data
        run: python -m pytest -m mysql -q -p no:cacheprovider --timeout=300

      - name: Slow / perf tests
        env:
          AICLS_DATA_ROOT: ${{ runner.temp }}/aicls-data
        run: python -m pytest -m "slow or perf" -q -p no:cacheprovider --timeout=1800

      - name: Property tests with 1000 examples
        env:
          HYPOTHESIS_PROFILE: nightly
          AICLS_DATA_ROOT: ${{ runner.temp }}/aicls-data
        run: python -m pytest tests/property -q -p no:cacheprovider --timeout=1800

      - name: Report check (promoted metrics)
        run: poe report-check
        continue-on-error: true # until `aicls report` lands

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[dev]"
      - name: pip-audit
        run: python -m pip_audit --progress-spinner off --strict
        continue-on-error: true # advisory until requirements/*.txt lockfiles exist
