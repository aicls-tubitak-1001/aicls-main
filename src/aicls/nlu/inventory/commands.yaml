# AI-CLS — Komut Envanteri v1 (docs/mimari/metin-komut-katmani.md §2, ADR-0005)
#
# 17 niyet. Bu dosya paket kaynağıdır (`importlib.resources`), kurulu wheel içinde de bulunur ve
# `aicls.nlu.inventory.schema.Inventory` tarafından yükleme anında doğrulanır.
#
# Desen sözdizimi (bkz. aicls/nlu/patterns.py):
#   {yuva}      yakalama; {yuva}? isteğe bağlı
#   kelime      düz belirteç — ardından gelen TEK ek belirteci kendiliğinden hoş görülür
#   (a|b)?      isteğe bağlı seçenek kümesi
#   <GEN> <DAT> <ABL> <ANY>   ek aileleri (aicls.core.turkish.TR_SUFFIXES)
#   <OBJ> <ORD> <DIR>        sözcük sınıfları (ifade/fonksiyon…, sıra sayıları, yön sözcükleri)
#
# Örnekler yalnızca belge değildir: `Inventory.validate_examples()` her birini yeniden çözer ve
# `datasets/nlu/commands_test.jsonl` bunlarla tohumlanır (test_inventory_every_example_...).
version: "1.0"

defaults:
  var: x
  min_score: 0.55
  margin: 0.15
  max_candidates: 3
  weights:
    pattern: 0.45
    keyword: 0.35
    coverage: 0.20
    conflict: 0.15
    slots: 0.20
    slots_missing: 0.40
  ambiguous_question_tr: "Komutu tam ayırt edemedim. Şunlardan hangisini kastettiniz?"
  suggestions_tr:
    - "x karenin türevini al"
    - "sıfırdan bire kadar x karenin integralini hesapla"
    - "x sonsuza giderken bir bölü x'in limiti"
    - "x kare eksi dört ifadesini çarpanlarına ayır"
    - "türev tanımını getir"

slot_types:
  EXPR: {kind: latex_expr}
  VAR: {kind: symbol}
  BOUNDS: {kind: pair, of: EXPR}
  POINT: {kind: expr_or_infty}
  DIRECTION: {kind: enum, values: ["+", "-", "+-"]}
  ORDER: {kind: int}
  UNIT_TYPE:
    kind: enum
    values: [Definition, Theorem, Lemma, Corollary, Proof, Example, Exercise, Figure, Table, Remark, Section]
  QUERY: {kind: text}

intents:
  # ==========================================================================================
  - id: differentiate
    kind: cas
    cas_op: diff
    label_tr: "türev alma"
    priority: 12
    tags: [core, calculus]
    slots:
      expr: {type: EXPR, required: true, from_context: last_latex}
      var: {type: VAR, required: true, default: x, from_context: active_var}
      order: {type: ORDER, default: 1, fill: scan, scan_key: order}
    keywords: {türev: 3, diferansiyel: 2, eğim: 1, mertebe: 1}
    patterns:
      # <NUM> önce gelir: rakamla söylenen mertebe ("iki mertebeden") tembel {expr} yakalamasının
      # içine düşerse hem ifade bozulur hem de üs ile mertebe aynı sayıyı paylaşır (KNOWN_ISSUES 1).
      - "{expr} <OBJ>? <NUM> (mertebe|derece) türev (al|hesapla|bul|çıkar)?"
      - "<NUM> (mertebe|derece) türev (al|hesapla|bul|çıkar)?"
      - "{expr} <OBJ>? <ORD>? (mertebe|derece)? türev (al|hesapla|bul|çıkar)?"
      - "{expr} <OBJ>? {var} <DAT>? göre <ORD>? (mertebe|derece)? türev (al|hesapla|bul)?"
      - "türev (al|hesapla|bul|çıkar)"
      - "<ORD> (mertebe|derece)? türev (al|hesapla|bul)?"
      # Mertebe cümlenin başında da söylenir: "ikinci mertebeden x karenin türevini al".
      - "<ORD> (mertebe|derece)? {expr} <OBJ>? türev (al|hesapla|bul|çıkar)?"
      - "{expr} <OBJ>? diferansiyel (al|hesapla)?"
    clarify_tr:
      expr: "Hangi ifadenin türevini alayım?"
      var: "Hangi değişkene göre türev alayım?"
    # Her differentiate örneği `order` bildirir: bildirilmeyen ama çözülen yuvayı görmezden gelen
    # eski slot_f1 tanımı, üssü mertebe sanan hatayı (KNOWN_ISSUES 1) ölçüme hiç yansıtmıyordu.
    examples:
      - {text: "x karenin türevini al", slots: {expr: "x^{2}", var: x, order: 1}}
      - {text: "sinüs x'in ikinci türevi", slots: {expr: "\\sin\\left(x\\right)", order: 2, var: x}}
      - {text: "türevini al", context: {last_latex: "x^{3}"}, slots: {expr: "x^{3}", order: 1, var: x}}
      - {text: "x kare artı iki x ifadesinin türevini hesapla", slots: {expr: "x^{2} + 2 x", order: 1, var: x}}
      - {text: "e üzeri x fonksiyonunun türevini bul", slots: {expr: "e^{x}", order: 1, var: x}}
      - {text: "kosinüs x fonksiyonunun türevini bul", slots: {expr: "\\cos\\left(x\\right)", order: 1, var: x}}
      - {text: "x küp eksi üç x ifadesinin x'e göre türevini al", slots: {expr: "x^{3} - 3 x", var: x, order: 1}}
      - {text: "üçüncü mertebeden türevini al", context: {last_latex: "x^{5}"}, slots: {expr: "x^{5}", order: 3, var: x}}
      - {text: "logaritma x'in türevini hesapla", slots: {expr: "\\log\\left(x\\right)", order: 1, var: x}}
      - {text: "bir bölü x fonksiyonunun türevi", slots: {expr: "\\frac{1}{x}", order: 1, var: x}}
      - {text: "karekök x ifadesinin türevini al", slots: {expr: "\\sqrt{x}", order: 1, var: x}}
      - {text: "iki x üzeri üç ifadesinin türevini bul", slots: {expr: "2 x^{3}", order: 1, var: x}}
      # KNOWN_ISSUES 1 gerileme ailesi: üs sayısı ASLA mertebe olamaz.
      - {text: "x üzeri üçün türevini al", slots: {expr: "x^{3}", var: x, order: 1}, tags: [regression_order]}
      - {text: "x üzeri beşin türevini al", slots: {expr: "x^{5}", var: x, order: 1}, tags: [regression_order]}
      - {text: "x üzeri üç türevini al", slots: {expr: "x^{3}", var: x, order: 1}, tags: [regression_order]}
      - {text: "x üzeri üç ifadesinin türevini al", slots: {expr: "x^{3}", var: x, order: 1}, tags: [regression_order]}
      - {text: "x üzeri üçün ikinci türevini al", slots: {expr: "x^{3}", var: x, order: 2}, tags: [regression_order]}
      - {text: "x küpünün ikinci türevini al", slots: {expr: "x^{3}", var: x, order: 2}, tags: [regression_order]}
      - {text: "x üzeri dördün türevini hesapla", slots: {expr: "x^{4}", var: x, order: 1}, tags: [regression_order]}
      - {text: "x üzeri üçün iki mertebeden türevini al", slots: {expr: "x^{3}", var: x, order: 2}, tags: [regression_order]}

  # ==========================================================================================
  - id: integrate_indefinite
    kind: cas
    cas_op: integrate
    label_tr: "belirsiz integral alma"
    priority: 10
    tags: [core, calculus]
    slots:
      expr: {type: EXPR, required: true, from_context: last_latex}
      var: {type: VAR, required: true, default: x, from_context: active_var}
    keywords: {integral: 3, belirsiz: 2, ilkel: 2}
    patterns:
      - "{expr} <OBJ>? belirsiz integral (al|hesapla|bul)?"
      - "{expr} <OBJ>? integral (al|hesapla|bul)?"
      - "{expr} <OBJ>? {var} <DAT>? göre integral (al|hesapla|bul)?"
      - "integral (al|hesapla|bul)"
      - "{expr} <OBJ>? ilkel <ANY>? (bul|hesapla)?"
    clarify_tr:
      expr: "Hangi ifadenin integralini alayım?"
      var: "Hangi değişkene göre integral alayım?"
    examples:
      - {text: "x karenin integralini al", slots: {expr: "x^{2}", var: x}}
      - {text: "sinüs x'in integralini hesapla", slots: {expr: "\\sin\\left(x\\right)", var: x}}
      - {text: "integralini al", context: {last_latex: "x^{2} + 1"}, slots: {expr: "x^{2} + 1", var: x}}
      - {text: "e üzeri x fonksiyonunun belirsiz integralini bul", slots: {expr: "e^{x}", var: x}}
      - {text: "iki x artı üç ifadesinin integralini al", slots: {expr: "2 x + 3", var: x}}
      - {text: "kosinüs x'in integralini bul", slots: {expr: "\\cos\\left(x\\right)", var: x}}
      - {text: "bir bölü x fonksiyonunun integralini hesapla", slots: {expr: "\\frac{1}{x}", var: x}}
      - {text: "x küp ifadesinin x'e göre integralini al", slots: {expr: "x^{3}", var: x}}
      - {text: "karekök x'in belirsiz integralini hesapla", slots: {expr: "\\sqrt{x}", var: x}}
      - {text: "x kare artı iki x eksi bir ifadesinin integralini bul", slots: {expr: "x^{2} + 2 x - 1", var: x}}
      - {text: "ln x'in integralini al", slots: {expr: "\\ln\\left(x\\right)", var: x}}
      # KNOWN_ISSUES 1 gerileme ailesi: mertebe düzeltmesi türev dışına taşmamalıdır.
      - {text: "x üzeri üçün integralini al", slots: {expr: "x^{3}", var: x}, tags: [regression_order]}

  # ==========================================================================================
  - id: integrate_definite
    kind: cas
    cas_op: integrate
    label_tr: "belirli integral alma"
    priority: 16
    tags: [core, calculus]
    slots:
      expr: {type: EXPR, required: true, from_context: last_latex}
      var: {type: VAR, required: true, default: x, from_context: active_var}
      lower: {type: BOUNDS, required: true}
      upper: {type: BOUNDS, required: true}
    keywords: {integral: 3, kadar: 2, belirli: 2, arası: 2}
    patterns:
      - "{lower} <ABL> {upper} <DAT> kadar {expr} <OBJ>? integral (al|hesapla|bul)?"
      - "{lower} <ABL> {upper} <DAT> {expr} <OBJ>? integral (al|hesapla|bul)?"
      - "{lower} <ABL> {upper} <DAT> kadar integral (al|hesapla|bul)?"
      - "{expr} <OBJ>? integral <ANY>? {lower} <ABL> {upper} <DAT> (kadar)? (al|hesapla|bul)?"
      - "{expr} <OBJ>? belirli integral {lower} <ABL> {upper} <DAT> (kadar)?"
    clarify_tr:
      expr: "Hangi ifadenin belirli integralini alayım?"
      var: "Hangi değişkene göre integral alayım?"
      lower: "Alt sınır nedir?"
      upper: "Üst sınır nedir?"
    examples:
      - {text: "sıfırdan bire kadar x karenin integralini hesapla", slots: {expr: "x^{2}", lower: "0", upper: "1", var: x}}
      - {text: "sıfırdan bire kadar x kare integralini hesapla", slots: {expr: "x^{2}", lower: "0", upper: "1", var: x}}
      - {text: "birden üçe kadar iki x integralini al", slots: {expr: "2 x", lower: "1", upper: "3", var: x}}
      - {text: "sıfırdan pi'ye kadar sinüs x integralini hesapla", slots: {expr: "\\sin\\left(x\\right)", lower: "0", upper: "\\pi", var: x}}
      - {text: "eksi birden bire kadar x küp integralini bul", slots: {expr: "x^{3}", lower: "-1", upper: "1", var: x}}
      - {text: "sıfırdan sonsuza kadar e üzeri eksi x integralini hesapla", slots: {expr: "e^{-x}", lower: "0", upper: "\\infty", var: x}}
      - {text: "birden ikiye kadar bir bölü x integralini al", slots: {expr: "\\frac{1}{x}", lower: "1", upper: "2", var: x}}
      - {text: "sıfırdan bire kadar x kare artı bir ifadesinin integralini hesapla", slots: {expr: "x^{2} + 1", lower: "0", upper: "1", var: x}}
      - {text: "ikiden dörde kadar x integralini bul", slots: {expr: "x", lower: "2", upper: "4", var: x}}
      - {text: "sıfırdan bire kadar integralini al", context: {last_latex: "x^{2}"}, slots: {expr: "x^{2}", lower: "0", upper: "1", var: x}}
      - {text: "eksi sonsuzdan sonsuza kadar e üzeri eksi x kare integralini hesapla", slots: {expr: "e^{-x^{2}}", lower: "-\\infty", upper: "\\infty", var: x}}
      - {text: "sıfırdan iki pi'ye kadar kosinüs x integralini al", slots: {expr: "\\cos\\left(x\\right)", lower: "0", upper: "2 \\pi", var: x}}

  # ==========================================================================================
  - id: limit
    kind: cas
    cas_op: limit
    label_tr: "limit hesaplama"
    priority: 16
    tags: [core, calculus]
    slots:
      expr: {type: EXPR, required: true, from_context: last_latex}
      var: {type: VAR, required: true, default: x, from_context: active_var}
      point: {type: POINT, required: true}
      direction: {type: DIRECTION, default: "+-", fill: scan, scan_key: direction}
    keywords: {limit: 3, giderken: 2, yaklaşırken: 2}
    patterns:
      - "{var} {point} <DAT> <DIR>? (taraf|yön)? (giderken|yaklaşırken|yaklaşan) {expr} <OBJ>? limit (al|hesapla|bul)?"
      - "limit {var} {point} <DAT> <DIR>? (taraf|yön)? (giderken|yaklaşırken|yaklaşan) {expr}"
      - "{expr} <OBJ>? limit {var} {point} <DAT> <DIR>? (taraf|yön)? (giderken|yaklaşırken|yaklaşan)"
      - "{var} {point} <DAT> <DIR>? (taraf|yön)? (giderken|yaklaşırken|yaklaşan) limit (al|hesapla|bul)?"
    clarify_tr:
      expr: "Hangi ifadenin limitini alayım?"
      point: "Değişken hangi noktaya gidiyor?"
      var: "Hangi değişken için limit alayım?"
    examples:
      - {text: "x sonsuza giderken bir bölü x'in limiti", slots: {expr: "\\frac{1}{x}", var: x, point: "\\infty", direction: "+-"}}
      - {text: "limit x sıfıra giderken sinüs x bölü x", slots: {expr: "\\frac{\\sin\\left(x\\right)}{x}", point: "0", direction: "+-", var: x}}
      - {text: "x sıfıra sağdan yaklaşırken bir bölü x'in limitini bul", slots: {expr: "\\frac{1}{x}", point: "0", direction: "+", var: x}}
      - {text: "x sıfıra soldan yaklaşırken bir bölü x'in limiti", slots: {expr: "\\frac{1}{x}", point: "0", direction: "-", var: x}}
      - {text: "x ikiye giderken x kare artı bir ifadesinin limiti", slots: {expr: "x^{2} + 1", point: "2", direction: "+-", var: x}}
      - {text: "x sonsuza giderken x kare bölü x küp limitini hesapla", slots: {expr: "\\frac{x^{2}}{x^{3}}", point: "\\infty", direction: "+-", var: x}}
      - {text: "limit x bire giderken x kare eksi bir", slots: {expr: "x^{2} - 1", point: "1", direction: "+-", var: x}}
      - {text: "x eksi sonsuza giderken e üzeri x'in limiti", slots: {expr: "e^{x}", point: "-\\infty", direction: "+-", var: x}}
      - {text: "x sıfıra giderken sinüs x bölü x limitini al", slots: {expr: "\\frac{\\sin\\left(x\\right)}{x}", point: "0", direction: "+-", var: x}}
      - {text: "x pi'ye giderken sinüs x'in limitini bul", slots: {expr: "\\sin\\left(x\\right)", point: "\\pi", direction: "+-", var: x}}
      - {text: "x üçe giderken iki x artı bir ifadesinin limitini hesapla", slots: {expr: "2 x + 1", point: "3", direction: "+-", var: x}}
      - {text: "x sıfıra sağdan yaklaşırken logaritma x'in limiti", slots: {expr: "\\log\\left(x\\right)", point: "0", direction: "+", var: x}}
      - {text: "x sıfıra giderken x üzeri üçün limitini bul", slots: {expr: "x^{3}", point: "0", direction: "+-", var: x}, tags: [regression_order]}

  # ==========================================================================================
  - id: solve
    kind: cas
    cas_op: solve
    label_tr: "denklem çözme"
    priority: 12
    tags: [core, algebra]
    slots:
      equation: {type: EXPR, required: true, from_context: last_latex}
      var: {type: VAR, required: true, default: x, from_context: active_var}
    keywords: {çöz: 3, denklem: 2, kök: 2}
    patterns:
      - "{equation} <OBJ>? çöz"
      - "{equation} <OBJ>? {var} <DAT>? göre çöz"
      - "{equation} <OBJ>? kök <ANY>? (bul|hesapla|göster)?"
      - "çöz {equation}"
      - "(denklem|eşitlik) <ANY>? çöz"
    clarify_tr:
      equation: "Hangi denklemi çözeyim?"
      var: "Hangi değişkene göre çözeyim?"
    examples:
      - {text: "üç x artı beş eşittir on denklemini çöz", slots: {equation: "3 x + 5 = 10", var: x}}
      - {text: "x kare eksi dört eşittir sıfır denklemini çöz", slots: {equation: "x^{2} - 4 = 0", var: x}}
      - {text: "x kare eksi dokuz ifadesinin köklerini bul", slots: {equation: "x^{2} - 9", var: x}}
      - {text: "iki x eksi altı eşittir sıfır denklemini çöz", slots: {equation: "2 x - 6 = 0", var: x}}
      - {text: "x kare artı üç x artı iki eşittir sıfır denklemini çöz", slots: {equation: "x^{2} + 3 x + 2 = 0", var: x}}
      - {text: "sinüs x eşittir sıfır denklemini çöz", slots: {equation: "\\sin\\left(x\\right) = 0", var: x}}
      - {text: "x kare artı iki x artı bir ifadesinin köklerini hesapla", slots: {equation: "x^{2} + 2 x + 1", var: x}}
      - {text: "denklemi çöz", context: {last_latex: "x^{2} - 4 = 0"}, slots: {equation: "x^{2} - 4 = 0", var: x}}
      - {text: "e üzeri x eşittir bir denklemini çöz", slots: {equation: "e^{x} = 1", var: x}}
      - {text: "x küp eksi x eşittir sıfır denklemini çöz", slots: {equation: "x^{3} - x = 0", var: x}}
      - {text: "üç x eksi dokuz eşittir sıfır denklemini x'e göre çöz", slots: {equation: "3 x - 9 = 0", var: x}}
      - {text: "x kare eşittir dokuz denklemini çöz", slots: {equation: "x^{2} = 9", var: x}}
      - {text: "x üzeri üç eşittir sekiz denklemini çöz", slots: {equation: "x^{3} = 8", var: x}, tags: [regression_order]}

  # ==========================================================================================
  - id: simplify
    kind: cas
    cas_op: simplify
    label_tr: "sadeleştirme"
    priority: 8
    tags: [core, algebra]
    slots:
      expr: {type: EXPR, required: true, from_context: last_latex}
    keywords: {sadeleştir: 3, düzenle: 2, basit: 2}
    patterns:
      - "{expr} <OBJ>? sadeleştir"
      - "sadeleştir"
      - "{expr} <OBJ>? (basit|sade) (hale)? (getir|yaz)"
      - "<OBJ> <ANY>? sadeleştir"
    clarify_tr:
      expr: "Hangi ifadeyi sadeleştireyim?"
    examples:
      - {text: "x kare artı iki x ifadesini sadeleştir", slots: {expr: "x^{2} + 2 x"}}
      - {text: "sadeleştir", context: {last_latex: "\\frac{x^{2}}{x}"}, slots: {expr: "\\frac{x^{2}}{x}"}}
      - {text: "x kare bölü x ifadesini sadeleştir", slots: {expr: "\\frac{x^{2}}{x}"}}
      - {text: "sinüs x artı kosinüs x ifadesini sadeleştir", slots: {expr: "\\sin\\left(x\\right) + \\cos\\left(x\\right)"}}
      - {text: "üç x artı iki x ifadesini sadeleştir", slots: {expr: "3 x + 2 x"}}
      - {text: "x kare artı x kare ifadesini sadeleştir", slots: {expr: "x^{2} + x^{2}"}}
      - {text: "bir bölü x artı bir bölü x ifadesini sadeleştir", slots: {expr: "\\frac{1}{x} + \\frac{1}{x}"}}
      - {text: "x kare çarpı x ifadesini sadeleştir", slots: {expr: "x^{2} x"}}
      - {text: "logaritma x artı logaritma x ifadesini sadeleştir", slots: {expr: "\\log\\left(x\\right) + \\log\\left(x\\right)"}}
      - {text: "ifadeyi sadeleştir", context: {last_latex: "x^{2} + x^{2}"}, slots: {expr: "x^{2} + x^{2}"}}
      - {text: "iki x artı üç x ifadesini sadeleştir", slots: {expr: "2 x + 3 x"}}

  # ==========================================================================================
  - id: expand
    kind: cas
    cas_op: expand
    label_tr: "parantez açma (dağıtma)"
    priority: 8
    tags: [algebra]
    slots:
      expr: {type: EXPR, required: true, from_context: last_latex}
    keywords: {genişlet: 3, dağıt: 2, açılım: 2, parantez: 2}
    patterns:
      - "{expr} <OBJ>? genişlet"
      - "{expr} <OBJ>? (dağıt|aç)"
      - "{expr} <OBJ>? açılım <ANY>? (yap|hesapla|bul)?"
      - "genişlet"
      - "parantez <ANY>? (aç|dağıt)"
    clarify_tr:
      expr: "Hangi ifadeyi açayım?"
    examples:
      - {text: "parantez aç x artı bir parantez kapa kare ifadesini genişlet", slots: {expr: "\\left(x + 1\\right)^{2}"}}
      - {text: "parantez aç x artı iki parantez kapa çarpı parantez aç x eksi iki parantez kapa ifadesini genişlet", slots: {expr: "\\left(x + 2\\right) \\left(x - 2\\right)"}}
      - {text: "genişlet", context: {last_latex: "\\left(x + 1\\right)^{2}"}, slots: {expr: "\\left(x + 1\\right)^{2}"}}
      - {text: "parantez aç x artı bir parantez kapa küp ifadesini genişlet", slots: {expr: "\\left(x + 1\\right)^{3}"}}
      - {text: "parantez aç iki x artı üç parantez kapa kare ifadesini genişlet", slots: {expr: "\\left(2 x + 3\\right)^{2}"}}
      - {text: "parantez aç x eksi bir parantez kapa kare ifadesini dağıt", slots: {expr: "\\left(x - 1\\right)^{2}"}}
      - {text: "parantez aç x artı y parantez kapa kare ifadesini genişlet", slots: {expr: "\\left(x + y\\right)^{2}"}}
      - {text: "parantez aç x artı bir parantez kapa çarpı x ifadesini dağıt", slots: {expr: "\\left(x + 1\\right) x"}}
      - {text: "parantezleri aç", context: {last_latex: "\\left(x + 1\\right)^{2}"}, slots: {expr: "\\left(x + 1\\right)^{2}"}}
      - {text: "parantez aç x artı üç parantez kapa kare ifadesini genişlet", slots: {expr: "\\left(x + 3\\right)^{2}"}}
      - {text: "parantez aç iki x eksi bir parantez kapa kare ifadesini genişlet", slots: {expr: "\\left(2 x - 1\\right)^{2}"}}

  # ==========================================================================================
  - id: factor
    kind: cas
    cas_op: factor
