# --------------------------------------------------------------------------------------------
# Buyrum (emir) kipindeki komut eylemleri. Sözcük sınırı kurtarmada (`Lexicon.resegment`) tek
# harflik bir parça ancak DEĞİŞKEN olabilir ve konuşulan matematikte değişkenden hemen sonra
# eylem gelmez ("x integralini al" evet, "x al" hayır). Bu liste olmadan "kaç" -> "k" + "aç"
# diye bölünür ve kapsam dışı bir soru komuta dönüşür.
# --------------------------------------------------------------------------------------------
command_verbs:
  - al
  - bul
  - hesapla
  - yap
  - çıkar
  - göster
  - getir
  - aç
  - dağıt
