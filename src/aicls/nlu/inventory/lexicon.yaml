# AI-CLS — konuşulan matematik sözlüğü ve ASR varyant katlaması
# (docs/mimari/metin-komut-katmani.md §3). Bu katlama YALNIZCA NLU içindir; WER hesabındaki
# normalizasyon `aicls.eval.normalizers.tr_v1` ile ayrı ve daha dardır (ADR-0015).
#
# Uygulama sırası (aicls.nlu.normalize):
#   1. `variants` — tek belirteç eşlemesi (ASR bozulmaları, yazım varyantları, işaretler)
#   2. ek ayırma — `vocabulary` içindeki gövdeler için (türevini -> türev + ini)
#   3. `phrases` — çok sözcüklü kalıplar (mutlak değer -> mutlakdeğer)
#   4. `fillers` — atılan dolgu sözcükleri
#   5. sayı sözcükleri -> rakam (numbers.yaml)
version: "1.0"

# --------------------------------------------------------------------------------------------
# Tek belirteç eşlemeleri. Sağ taraf, dilbilgisinin ve desenlerin gördüğü kanonik biçimdir.
# Matematik fonksiyonları LaTeX adlarına indirgenir (sinüs -> sin), böylece hem
# spoken_math dilbilgisi hem de desenler tek bir biçimle çalışır.
# --------------------------------------------------------------------------------------------
variants:
  # işaretler ve semboller
  "+": artı
  "-": eksi
  "*": çarpı
  "/": bölü
  "=": eşittir
  "^": üssü
  "×": çarpı
  "÷": bölü

  # operatörler ve yazım varyantları
  arti: artı
  eksik: eksi
  carpi: çarpı
  çarpim: çarpı
  bolu: bölü
  bölme: bölü
  ussu: üssü
  üs: üssü
  uzeri: üzeri
  üzerine: üzeri
  esittir: eşittir
  eşit: eşittir
  faktoriyel: faktöriyel
  faktöryel: faktöriyel

  # kökler ve kuvvetler
  karekok: karekök
  karakök: karekök
  kupkok: küpkök
  küpkok: küpkök
  karesi: kare
  küpü: küp
  kübü: küp

  # trigonometri ve diğer fonksiyonlar
  sinüs: sin
  sinus: sin
  sinüsü: sin
  kosinüs: cos
  kosinus: cos
  cosinüs: cos
  kosinüsü: cos
  tanjant: tan
  tanjand: tan
  tanjantı: tan
  kotanjant: cot
  kotanjantı: cot
  sekant: sec
  kosekant: csc
  arksinüs: arcsin
  arkkosinüs: arccos
  arktanjant: arctan
  arkkotanjant: arccot
  hiperbolik: hiperbolik
  logaritma: log
  logaritması: log
  lg: log
  üstel: exp
  eksponansiyel: exp

  # sabitler
  sonsuzluk: sonsuz
  sonsuzu: sonsuz
  sayısı: sayı

  # yunan harfleri
  alfa: alpha
  beta: beta
  gama: gamma
  delta: delta
  epsilon: epsilon
  teta: theta
  lamda: lambda
  mü: mu
  ro: rho
  sigma: sigma
  fi: phi
  omega: omega

  # ASR bozulmaları ve düzensiz gövdeler (İP-3 okuma senaryolarından beklenenler)
  türef: türev
  turev: türev
  entegral: integral
  entegrali: integral
  integrali: integral
  integralı: integral
  intagral: integral
  limitin: limit
  denkelem: denklem
  çarpanlarına: çarpan
  çarpanlarını: çarpan
  çarpanları: çarpan
  çarpanlara: çarpan
  sadelestir: sadeleştir
  basitleştir: sadeleştir
  grafiğ: grafik
  grafiği: grafik
  şekl: şekil
  örneğ: örnek
  sonuc: sonuç
  çizdir: çiz
  göstersene: göster
  getirsene: getir

# --------------------------------------------------------------------------------------------
# Çok sözcüklü kalıplar (uzun olan önce uygulanır).
# --------------------------------------------------------------------------------------------
phrases:
  "mutlak değer": mutlakdeğer
  "kare kök": karekök
  "küp kök": küpkök
  "doğal log": ln
  "parantez aç": "("
  "parantez kapa": ")"
  "parantez kapat": ")"
  "parantezi kapa": ")"
  "ters sin": arcsin
  "ters cos": arccos
  "ters tan": arctan

