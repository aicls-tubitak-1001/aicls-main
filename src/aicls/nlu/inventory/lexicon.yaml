# --------------------------------------------------------------------------------------------
# Tarama (scan) yuvaları: desende yakalanmaz, metnin tamamında aranır.
# --------------------------------------------------------------------------------------------
scan:
  direction:
    - {words: [sağdan], value: "+"}
    - {words: [sağ, taraf], value: "+"}
    - {words: [pozitif, taraf], value: "+"}
    - {words: [pozitif, yön], value: "+"}
    - {words: [soldan], value: "-"}
    - {words: [sol, taraf], value: "-"}
    - {words: [negatif, taraf], value: "-"}
    - {words: [negatif, yön], value: "-"}
  unit_type:
    - {words: [tanım], value: Definition}
    - {words: [teorem], value: Theorem}
    - {words: [lemma], value: Lemma}
    - {words: [önerme], value: Lemma}
    - {words: [sonuç], value: Corollary}
    - {words: [örnek], value: Example}
    - {words: [alıştırma], value: Exercise}
    - {words: [soru], value: Exercise}
    - {words: [şekil], value: Figure}
    - {words: [tablo], value: Table}
    - {words: [kanıt], value: Proof}
    - {words: [ispat], value: Proof}
    - {words: [bölüm], value: Section}
