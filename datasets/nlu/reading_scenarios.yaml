# AI-CLS — Okuma Senaryoları Kütüphanesi (İP-3 / İP-4)
#
# Amaç: "Model Gelişimine Katkıda Bulun" sekmesinde katılımcıya okutulacak Türkçe cümleler
# (`prompt_sentences` tablosunun tohumu) ve `datasets/nlu/commands_test.jsonl` altın kümesinin
# çekirdeği. Her cümle bir senaryo etiketi, bir hedef niyet (ya da ifade okuma için `null`) ve
# bir zorluk derecesi taşır; `aicls.collect.service.next_prompts` senaryolar arasında dengeleme
# yapabilsin diye etiket zorunludur.
#
# Alanlar `aicls.db.models.audio.PromptSentence` ile birebir eşleşir:
#   text -> text_tr, tag -> scenario_tag, intent -> intent, difficulty -> difficulty
#
# KAYNAK/KAPSAM UYARISI: bu sürüm proje ekibince YAZILMIŞTIR (source: authored). Öneri metnindeki
# hedef ≥ 600 cümledir; buradaki küme o hedefin çekirdeğidir ve pilot sonrası gerçek ASR
# çıktılarıyla (source: asr_output / pilot) genişletilecektir. Ölçüm raporlarında bu ayrım
# açıkça belirtilmelidir (bkz. KNOWN_ISSUES.md "Metrik provenansı").
#
# Not: `aicls.asr.stub.STUB_SENTENCES` ve `aicls.data.audio_commands` içindeki 12 cümlelik
# gömülü liste bu dosyayla değiştirilmelidir (kütüphane kodunda veri tutulmamalı).
