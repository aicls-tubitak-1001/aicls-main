# MkDocs site (ADR-0009): Material theme in Turkish, strict build, mkdocstrings for the code
# reference, macros reading reports/metrics/latest.json so report pages never hand-type numbers.
site_name: AI-CLS Teknik Dokümantasyonu
site_description: "TÜBİTAK 1001 125E748 — Temel Analiz öğretimi için yapay zeka destekli etkileşimli platform"
site_author: "AI-CLS dijital ekibi"
site_url: "https://ai-cls.github.io/ai-cls/"
repo_name: ai-cls
docs_dir: docs
site_dir: site
strict: true
use_directory_urls: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn

theme:
  name: material
  language: tr
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Koyu temaya geç
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Açık temaya geç
  font: false # no Google Fonts fetch; system fonts

plugins:
  - search:
      lang: tr
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            members_order: source
            separate_signature: true
            merge_init_into_class: true
  - macros:
      # Metric values for report pages: {{ metrics.ocr.cer }} etc. (ADR-0009, ADR-0015).
      # Pages that use macros must opt in with `render_macros: true` in their front matter,
      # because prose pages quote literal `{{ metrics.<kind>.<metric> }}` examples.
      include_yaml:
        - metrics: reports/metrics/latest.json
      render_by_default: false
      on_error_fail: true
      on_undefined: strict

markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 3
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - tables
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - def_list
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16/dist/contrib/auto-render.min.js

extra_css:
  - https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.css

extra:
  project_id: "125E748"
  generator: false

nav:
  - Başlangıç: index.md
  - Mimari:
      - Genel bakış: mimari/genel-bakis.md
      - Modüller: mimari/moduller.md
      - API: mimari/api.md
      - Veri modeli: mimari/veri-modeli.md
