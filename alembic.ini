# Alembic configuration (ADR-0003). The database URL is NOT stored here: `env.py` reads
# `AICLS_DB_URL` via `aicls.core.settings` (SQLite in dev/test, MySQL 8 in prod).
[alembic]
script_location = src/aicls/db/migrations
prepend_sys_path = src
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 40
timezone = UTC
version_path_separator = os
# sqlalchemy.url is intentionally absent — see env.py (AICLS_DB_URL)

[post_write_hooks]
hooks = ruff_format, ruff_fix
ruff_format.type = exec
ruff_format.executable = python
ruff_format.options = -m ruff format REVISION_SCRIPT_FILENAME
ruff_fix.type = exec
ruff_fix.executable = python
ruff_fix.options = -m ruff check --fix --exit-zero REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
